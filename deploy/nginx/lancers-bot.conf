# nginx in front of the extension server (run_server.py on 127.0.0.1:8765).
#
#   sudo cp deploy/nginx/lancers-bot.conf /etc/nginx/sites-available/lancers-bot
#   (replace bot.example.com below with your domain, pointed at this machine)
#   sudo ln -s /etc/nginx/sites-available/lancers-bot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bot.example.com --redirect   # adds TLS on 443 + the http -> https redirect
#
# The extension then connects to wss://bot.example.com (Settings -> Server URL).
# Until certbot has run this serves plain ws:// — don't hand out tokens before that.

# The extension's token travels in the WebSocket URL: log requests without the query string
log_format lancers_noquery '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name bot.example.com;

    access_log /var/log/nginx/lancers-bot.access.log lancers_noquery;

    location = /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The server pings every 20 s; keep idle connections well past that
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8765;
    }

    location / {
        return 404;
    }
}
